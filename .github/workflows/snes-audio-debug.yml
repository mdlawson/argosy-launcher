name: SNES audio debug APK

on:
  push:
    branches: [debug/snes-audio-test-20261012]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snes-audio-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Select Android user directory
        run: |
          mkdir -p "$RUNNER_TEMP/argosy-audio-android-user"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/argosy-audio-android-user" >> "$GITHUB_ENV"

      - name: Preserve debug signing key
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_USER_HOME }}/debug.keystore
          key: argosy-audio-debug-key-v2

      - name: Validate Windows helper
        shell: pwsh
        run: |
          $parserTokens = $null
          $parserErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/Collect-ArgosyAudio.ps1", [ref]$parserTokens, [ref]$parserErrors)
          if ($parserErrors.Count -gt 0) {
            $parserErrors | Format-List
            exit 1
          }

      - name: Test streaming resampler
        run: |
          cmake -S libretrodroid/src/main/cpp/tests/resampler -B /tmp/argosy-resampler-tests
          cmake --build /tmp/argosy-resampler-tests
          ctest --test-dir /tmp/argosy-resampler-tests --output-on-failure

      - name: Test WAV capture
        run: |
          cmake -S libretrodroid/src/main/cpp/tests/capture -B /tmp/argosy-capture-tests
          cmake --build /tmp/argosy-capture-tests
          ctest --test-dir /tmp/argosy-capture-tests --output-on-failure

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Verify debug signing key location
        run: test -s "$ANDROID_USER_HOME/debug.keystore"

      - name: Package test APK
        run: |
          mkdir -p audio-test
          cp app/build/outputs/apk/debug/app-debug.apk audio-test/argosy-2.20.5-audio-debug.apk
          cp docs/snes-audio-testing.md audio-test/TESTING.md
          cp scripts/Collect-ArgosyAudio.ps1 audio-test/
          cd audio-test
          sha256sum argosy-2.20.5-audio-debug.apk > SHA256SUMS

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: argosy-snes-audio-test
          path: audio-test/
          if-no-files-found: error
          retention-days: 14
